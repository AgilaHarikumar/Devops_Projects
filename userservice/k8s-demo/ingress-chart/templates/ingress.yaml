apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /users
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.userServiceName }}
                port:
                  number: 8081
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.orderServiceName }}
                port:
                  number: 8082